[project]
name = "pan"
version = "0.0.1"
description = "Typed System 1 questions over telemetry, summarized for coding agents"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
jev = ["typesafe-sdk"]
bench = ["duckdb", "pandas"]

[project.scripts]
pan = "pan.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 110
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
